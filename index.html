<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- TS4NFDI Widgets -->
		<link
			rel="stylesheet"
			href="https://ts4nfdi.github.io/terminology-service-suite/js-modules/latest/terminology-service-suite.min.css"
		/>
		<script
			type="text/javascript"
			src="https://ts4nfdi.github.io/terminology-service-suite/js-modules/latest/terminology-service-suite.min.js"
		></script>

		<title>ISA Wizard</title>
	</head>
	<body class="bg-base-200">

		<div class="tabs tabs-lift p-4">
		<label class="tab">
			<input type="radio" name="my_tabs_4" />
			<img src="/svelte-icon-svgrepo-com.svg" alt="Svelte Logo" class="w-4 h-4 inline-block mr-1" />			
			Svelte Component
		</label>
		<div class="tab-content bg-base-100 border-base-300 p-6">
			
			<div id="app"></div>
			
		</div>

		<label class="tab">
			<input type="radio" name="my_tabs_4" checked="checked" />
			<img src="/webcomponents-svgrepo-com.svg" alt="Web Component Logo" class="w-4 h-4 inline-block mr-1" />
			Web Component
		</label>
		<div class="tab-content bg-base-100 border-base-300 p-6">
			
			<isa-wizard config-url="/nested-config.json"></isa-wizard>
			<script type="module" src="/src/main.ts"></script>

		</div>		
	</body>
</html>
